<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <defs>
    <linearGradient id="sortGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="orgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="anorgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="b3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>
  <!-- Background Shape -->
  <rect x="20" y="20" width="460" height="310" rx="28" fill="url(#sortGrad1)"/>
  <circle cx="250" cy="175" r="140" fill="#ECFDF5" opacity="0.6"/>
  <!-- Platform -->
  <ellipse cx="250" cy="275" rx="190" ry="22" fill="#E2E8F0"/>
  <!-- Bin 1: Organik (Green) -->
  <g transform="translate(80, 110)">
    <rect x="15" y="40" width="80" height="110" rx="10" fill="url(#orgGrad)"/>
    <path d="M10 32 L100 32 L95 40 L15 40 Z" fill="#047857"/>
    <circle cx="55" cy="24" r="8" fill="#10B981"/>
    <rect x="25" y="60" width="60" height="70" rx="6" fill="#065F46" opacity="0.2"/>
    <!-- Leaf Icon on Bin -->
    <path d="M55 70 C45 70 40 80 40 95 C55 95 65 90 65 75 Z" fill="#FFFFFF"/>
    <path d="M55 70 Q48 85 43 95" stroke="#A7F3D0" stroke-width="2"/>
    <text x="55" y="125" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ORGANIK</text>
  </g>
  <!-- Bin 2: Anorganik (Blue) -->
  <g transform="translate(195, 100)">
    <rect x="15" y="40" width="80" height="120" rx="10" fill="url(#anorgGrad)"/>
    <path d="M10 32 L100 32 L95 40 L15 40 Z" fill="#0369A1"/>
    <circle cx="55" cy="24" r="8" fill="#0284C7"/>
    <rect x="25" y="60" width="60" height="80" rx="6" fill="#075985" opacity="0.2"/>
    <!-- Recycle Icon on Bin -->
    <path d="M55 72 L62 82 H58 V92 H52 V82 H48 Z" fill="#FFFFFF"/>
    <circle cx="55" cy="85" r="12" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="8 4" fill="none"/>
    <text x="55" y="135" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ANORGANIK</text>
  </g>
  <!-- Bin 3: B3 (Red) -->
  <g transform="translate(310, 110)">
    <rect x="15" y="40" width="80" height="110" rx="10" fill="url(#b3Grad)"/>
    <path d="M10 32 L100 32 L95 40 L15 40 Z" fill="#B91C1C"/>
    <circle cx="55" cy="24" r="8" fill="#EF4444"/>
    <rect x="25" y="60" width="60" height="70" rx="6" fill="#7F1D1D" opacity="0.2"/>
    <!-- Hazard Icon on Bin -->
    <polygon points="55,72 68,96 42,96" fill="#FFFFFF"/>
    <rect x="54" y="80" width="2" height="7" fill="#B91C1C"/>
    <circle cx="55" cy="91" r="1.5" fill="#B91C1C"/>
    <text x="55" y="125" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LIMBAH B3</text>
  </g>
  <!-- Sparkles & Flow arrows -->
  <path d="M130 90 Q190 60 250 85 T370 90" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 6" fill="none"/>
  <circle cx="160" cy="72" r="4" fill="#10B981"/>
  <circle cx="340" cy="76" r="4" fill="#0284C7"/>
</svg>

