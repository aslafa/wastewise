<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="bgDried" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FFFBEB"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" rx="20" fill="url(#bgDried)"/>

  <!-- Modern Kraft Stand-Up Pouch for Dried BSF -->
  <g transform="translate(160, 105)">
    <!-- Shadow -->
    <ellipse cx="0" cy="65" rx="50" ry="12" fill="#D97706" opacity="0.2"/>
    <!-- Pouch Body -->
    <path d="M -42 55 L -35 -45 L 35 -45 L 42 55 Z" fill="#D97706" stroke="#92400E" stroke-width="2"/>
    <!-- Zip Seal -->
    <line x1="-33" y1="-35" x2="33" y2="-35" stroke="#78350F" stroke-width="2"/>
    <!-- Transparent Window in Pouch -->
    <rect x="-24" y="-15" width="48" height="42" rx="10" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
    
    <!-- Crispy Dried Maggots inside Window -->
    <g fill="#B45309" stroke="#78350F" stroke-width="0.8">
      <ellipse cx="-12" cy="0" rx="6" ry="2.5" transform="rotate(-15 -12 0)"/>
      <ellipse cx="6" cy="-4" rx="7" ry="2.8" transform="rotate(35 6 -4)"/>
      <ellipse cx="-4" cy="12" rx="7" ry="3" transform="rotate(5 -4 12)"/>
      <ellipse cx="10" cy="14" rx="6" ry="2.4" transform="rotate(-30 10 14)"/>
      <ellipse cx="0" cy="2" rx="5" ry="2.2" transform="rotate(20 0 2)"/>
    </g>

    <!-- Label on Pouch -->
    <rect x="-26" y="-30" width="52" height="10" rx="2" fill="#FEF3C7"/>
    <text x="0" y="-23" fill="#78350F" font-family="system-ui, sans-serif" font-size="6.5" font-weight="900" text-anchor="middle">DRIED BSF MAGGOT</text>

    <!-- Warm Sunshine rays / Drying process icon -->
    <g transform="translate(75, -45)">
      <circle cx="0" cy="0" r="16" fill="#F59E0B"/>
      <line x1="-22" y1="0" x2="-18" y2="0" stroke="#F59E0B" stroke-width="2"/>
      <line x1="22" y1="0" x2="18" y2="0" stroke="#F59E0B" stroke-width="2"/>
      <line x1="0" y1="-22" x2="0" y2="-18" stroke="#F59E0B" stroke-width="2"/>
      <line x1="0" y1="22" x2="0" y2="18" stroke="#F59E0B" stroke-width="2"/>
    </g>
  </g>

  <!-- Tag Pill -->
  <rect x="70" y="185" width="180" height="22" rx="7" fill="#B45309"/>
  <text x="160" y="200" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">
    Pakan Kering Tahan Simpan
  </text>
</svg>
