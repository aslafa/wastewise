<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" fill="none">
  <defs>
    <linearGradient id="heroBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDF7EA" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E6F9F0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFF9ED" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="greenBin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A765"/>
      <stop offset="100%" stop-color="#006B45"/>
    </linearGradient>
    <linearGradient id="blueBin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="redBin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="heroShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#006B45" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Background Halo -->
  <circle cx="300" cy="240" r="210" fill="url(#heroBgGrad)"/>
  <circle cx="430" cy="140" r="60" fill="#DDF7EA" opacity="0.6"/>
  <circle cx="150" cy="360" r="80" fill="#FFF9ED" opacity="0.8"/>

  <!-- Orbital Flow Lines -->
  <path d="M 120 250 C 130 110, 470 100, 480 240 C 490 380, 150 400, 120 250" 
        stroke="#009B63" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.4" fill="none"/>

  <!-- Left: Organic Green Bin -->
  <g transform="translate(140, 210)" filter="url(#heroShadow)">
    <rect x="-35" y="0" width="70" height="95" rx="14" fill="url(#greenBin)"/>
    <path d="M-40 0 C-40 -8, 40 -8, 40 0 Z" fill="#006B45"/>
    <rect x="-14" y="-12" width="28" height="6" rx="3" fill="#004D31"/>
    <!-- Leaf Icon on Bin -->
    <path d="M0 28 C12 28, 18 42, 18 52 C6 52, -2 46, 0 28 Z" fill="#DDF7EA" opacity="0.95"/>
    <path d="M2 32 C2 44, 12 50, 12 50" stroke="#006B45" stroke-width="1.5" stroke-linecap="round"/>
    <text x="0" y="78" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="1">ORGANIK</text>
  </g>

  <!-- Center-Right: Anorganic Blue Bin -->
  <g transform="translate(420, 220)" filter="url(#heroShadow)">
    <rect x="-34" y="0" width="68" height="90" rx="14" fill="url(#blueBin)"/>
    <path d="M-38 0 C-38 -8, 38 -8, 38 0 Z" fill="#0369A1"/>
    <rect x="-13" y="-12" width="26" height="6" rx="3" fill="#075985"/>
    <!-- Recycle Icon on Bin -->
    <path d="M-8 32 L-2 24 L4 32 H1 V42 H-5 V32 Z" fill="#E0F2FE"/>
    <path d="M6 36 L12 44 L6 50 V46 H-4 V42 H6 Z" fill="#E0F2FE"/>
    <text x="0" y="75" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="1">ANORGANIK</text>
  </g>

  <!-- Far Left: B3 Hazard Bin (Compact) -->
  <g transform="translate(68, 270)" filter="url(#heroShadow)">
    <rect x="-24" y="0" width="48" height="68" rx="10" fill="url(#redBin)"/>
    <path d="M-28 0 C-28 -6, 28 -6, 28 0 Z" fill="#991B1B"/>
    <!-- Hazard Warning Icon -->
    <path d="M0 16 L12 36 H-12 Z" fill="#FEE2E2"/>
    <circle cx="0" cy="32" r="1.5" fill="#B91C1C"/>
    <rect x="-1" y="22" width="2" height="6" rx="1" fill="#B91C1C"/>
    <text x="0" y="54" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8" font-weight="800" text-anchor="middle">B3</text>
  </g>

  <!-- Centerpiece: Smartphone with WasteWise AI Scan -->
  <g transform="translate(285, 140)" filter="url(#heroShadow)">
    <!-- Phone Body -->
    <rect x="-65" y="0" width="130" height="230" rx="26" fill="url(#phoneGrad)"/>
    <rect x="-60" y="5" width="120" height="220" rx="22" fill="#0F172A"/>
    <!-- Screen -->
    <rect x="-56" y="16" width="112" height="198" rx="16" fill="#F8FAFC"/>
    
    <!-- Phone Top Notch -->
    <rect x="-22" y="8" width="44" height="6" rx="3" fill="#334155"/>
    <circle cx="16" cy="11" r="2" fill="#006B45"/>

    <!-- App Camera Viewfinder Screen -->
    <rect x="-48" y="28" width="96" height="85" rx="10" fill="#E2E8F0"/>
    <!-- Target Crosshairs -->
    <path d="M-38 38 H-30 V46" stroke="#009B63" stroke-width="2.5" fill="none"/>
    <path d="M38 38 H30 V46" stroke="#009B63" stroke-width="2.5" fill="none"/>
    <path d="M-38 103 H-30 V95" stroke="#009B63" stroke-width="2.5" fill="none"/>
    <path d="M38 103 H30 V95" stroke="#009B63" stroke-width="2.5" fill="none"/>
    
    <!-- Scanned Apple & Leaf Icon inside Viewfinder -->
    <circle cx="0" cy="70" r="18" fill="#16A765" opacity="0.2"/>
    <path d="M-6 66 C-12 58, 12 56, 8 72 C5 82, -4 80, -6 66 Z" fill="#16A765"/>
    <path d="M0 60 C4 54, 8 55, 6 62" stroke="#006B45" stroke-width="2" fill="none"/>

    <!-- AI Detection Tag -->
    <g transform="translate(0, 126)">
      <rect x="-48" y="0" width="96" height="24" rx="7" fill="#DDF7EA" stroke="#16A765" stroke-width="1"/>
      <circle cx="-34" cy="12" r="4" fill="#009B63"/>
      <text x="-24" y="15" fill="#006B45" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold">AI: Organik 98%</text>
    </g>

    <!-- App Points & Button in screen -->
    <g transform="translate(0, 160)">
      <rect x="-48" y="0" width="96" height="22" rx="7" fill="#006B45"/>
      <text x="0" y="14" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">Jemput Sampah</text>
    </g>
    <g transform="translate(0, 192)">
      <text x="0" y="10" fill="#64748B" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">Saldo: 1,450 Poin</text>
    </g>
  </g>

  <!-- Floating Floating Badge 1: Verified Points (Top Right) -->
  <g transform="translate(460, 110)" filter="url(#heroShadow)">
    <rect x="-65" y="-22" width="130" height="44" rx="14" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
    <circle cx="-42" cy="0" r="14" fill="url(#goldGrad)"/>
    <text x="-42" y="4" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">★</text>
    <text x="14" y="-3" fill="#1E293B" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">+150 Poin</text>
    <text x="14" y="11" fill="#D97706" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">Hasil Timbangan</text>
  </g>

  <!-- Floating Badge 2: Digital Scale (Bottom Center) -->
  <g transform="translate(320, 400)" filter="url(#heroShadow)">
    <rect x="-75" y="-20" width="150" height="42" rx="14" fill="#FFFFFF" stroke="#009B63" stroke-width="1.5"/>
    <circle cx="-50" cy="1" r="13" fill="#DDF7EA"/>
    <!-- Scale icon -->
    <path d="M-56 3 L-50 -5 L-44 3 Z" fill="#006B45"/>
    <path d="M-50 -5 V7 M-55 7 H-45" stroke="#006B45" stroke-width="1.5" stroke-linecap="round"/>
    <text x="12" y="-2" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Berat Riil: 4.8 Kg</text>
    <text x="12" y="12" fill="#16A765" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">✓ Terverifikasi Petugas</text>
  </g>

  <!-- Eco Plants & Sprout Elements around -->
  <g transform="translate(195, 335)">
    <path d="M0 0 C-10 -20, 5 -35, 12 -40 C14 -25, 10 -10, 0 0 Z" fill="#16A765"/>
    <path d="M0 0 C15 -18, 30 -15, 32 -32 C18 -32, 10 -15, 0 0 Z" fill="#009B63"/>
    <circle cx="0" cy="0" r="4" fill="#004D31"/>
  </g>
</svg>

