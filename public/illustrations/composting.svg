    <line x1="32" y1="90" x2="88" y2="90" stroke="#059669" stroke-width="3"/>
    <line x1="35" y1="115" x2="85" y2="115" stroke="#059669" stroke-width="3"/>
    <circle cx="60" cy="24" r="6" fill="#10B981"/>
