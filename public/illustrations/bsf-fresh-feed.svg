<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="bgFreshFeed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFBF1"/>
      <stop offset="100%" stop-color="#F0FDFA"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" rx="20" fill="url(#bgFreshFeed)"/>
  
  <!-- Basin with Live Maggots -->
  <g transform="translate(100, 140)">
    <ellipse cx="0" cy="0" rx="65" ry="24" fill="#0D9488" opacity="0.2"/>
    <ellipse cx="0" cy="-6" rx="60" ry="20" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <!-- Larvae wriggling -->
    <g fill="#FEF3C7" stroke="#78350F" stroke-width="1">
      <ellipse cx="-30" cy="-8" rx="8" ry="3.5" transform="rotate(-10 -30 -8)"/>
      <ellipse cx="-10" cy="-4" rx="9" ry="4" transform="rotate(20 -10 -4)"/>
      <ellipse cx="15" cy="-7" rx="8" ry="3.5" transform="rotate(-15 15 -7)"/>
      <ellipse cx="32" cy="-5" rx="7" ry="3" transform="rotate(30 32 -5)"/>
      <ellipse cx="-2" cy="-10" rx="9" ry="3.5" transform="rotate(5 -2 -10)"/>
    </g>
  </g>

  <!-- Happy Chicken on Left -->
  <g transform="translate(65, 80)">
    <!-- Body -->
    <path d="M -15 25 C -25 25, -25 5, -10 -5 C 5 -15, 20 0, 15 25 Z" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <!-- Comb / Jengger -->
    <path d="M -2 -12 C 0 -18, 6 -16, 8 -12 C 12 -16, 16 -12, 14 -8 Z" fill="#EF4444"/>
    <!-- Beak / Paruh -->
    <polygon points="15,-6 22,-2 15,2" fill="#F59E0B"/>
    <!-- Eye -->
    <circle cx="8" cy="-6" r="2" fill="#142B36"/>
    <!-- Wing -->
    <path d="M -8 10 C -12 2, 2 2, 6 12 C 4 18, -6 18, -8 10 Z" fill="#E2E8F0"/>
  </g>

  <!-- Healthy Catfish (Lele) on Right -->
  <g transform="translate(230, 110)">
    <!-- Fish Body -->
    <path d="M -40 0 C -20 -14, 20 -12, 35 0 C 20 12, -20 14, -40 0 Z" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Tail Fin -->
    <path d="M 33 0 L 48 -10 L 44 0 L 48 10 Z" fill="#475569"/>
    <!-- Whiskers (Kumis Lele) -->
    <path d="M -35 2 C -42 6, -46 12, -48 18" stroke="#0F172A" stroke-width="1.5" fill="none"/>
    <path d="M -36 -2 C -42 -6, -46 -10, -48 -14" stroke="#0F172A" stroke-width="1.5" fill="none"/>
    <!-- Eye -->
    <circle cx="-30" cy="-3" r="1.8" fill="#F8FAFC"/>
    <circle cx="-30" cy="-3" r="0.9" fill="#020617"/>
    <!-- Water ripples -->
    <path d="M -20 22 Q 0 18 20 22" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Tag Pill -->
  <rect x="75" y="185" width="170" height="22" rx="7" fill="#0F766E"/>
  <text x="160" y="200" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">
    Pakan Alami Ayam & Lele
  </text>
</svg>
