<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <defs>
    <linearGradient id="orgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDF7EA"/>
      <stop offset="100%" stop-color="#E8F9F1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="20" fill="url(#orgBg)"/>
  
  <!-- Composting Pot & Plants -->
  <g transform="translate(200, 140)">
    <!-- Soil mound -->
    <path d="M-80 50 Q0 25 80 50 Z" fill="#78350F" opacity="0.85"/>
    <ellipse cx="0" cy="50" rx="90" ry="12" fill="#58240C"/>

    <!-- Bin Container -->
    <path d="M-45 45 L-40 -15 H40 L45 45 Z" fill="#006B45" rx="6"/>
    <rect x="-44" y="-20" width="88" height="8" rx="4" fill="#004D31"/>

    <!-- Organic Icons inside and around -->
    <!-- Apple core / fruit -->
    <g transform="translate(-15, 0)">
      <circle cx="0" cy="0" r="14" fill="#16A765"/>
      <path d="M0 -14 Q6 -22 8 -24" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M4 -20 Q12 -22 14 -16 Q8 -14 4 -20 Z" fill="#16A765"/>
    </g>

    <!-- Vegetable / Carrot -->
    <g transform="translate(18, 5) rotate(25)">
      <path d="M-6 -15 L6 -15 L2 18 L-2 18 Z" fill="#F59E0B" rx="3"/>
      <path d="M0 -15 L-4 -24 M0 -15 L0 -26 M0 -15 L4 -24" stroke="#009B63" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Growing Sprout (Nutrient output) -->
    <g transform="translate(0, -25)">
      <path d="M0 5 Q-14 -12 -12 -26 Q2 -20 0 5 Z" fill="#009B63"/>
      <path d="M0 5 Q14 -12 12 -26 Q-2 -20 0 5 Z" fill="#16A765"/>
      <line x1="0" y1="5" x2="0" y2="-12" stroke="#004D31" stroke-width="2"/>
    </g>

    <!-- Floating Badges: Maggot BSF & Pupuk -->
    <g transform="translate(-80, -20)">
      <rect x="-35" y="-12" width="70" height="24" rx="12" fill="#FFFFFF" stroke="#009B63" stroke-width="1.5"/>
      <text x="0" y="4" fill="#006B45" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">🌱 Pupuk Kompos</text>
    </g>
    <g transform="translate(80, -20)">
      <rect x="-42" y="-12" width="84" height="24" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="0" y="4" fill="#92400E" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">🐛 Maggot BSF</text>
    </g>
  </g>
</svg>

