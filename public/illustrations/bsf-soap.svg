<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="bgSoap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="soapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="oilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" rx="20" fill="url(#bgSoap)"/>

  <!-- Oil Dropper Bottle (Left) -->
  <g transform="translate(100, 105)">
    <!-- Shadow -->
    <ellipse cx="0" cy="55" rx="22" ry="7" fill="#6D28D9" opacity="0.15"/>
    <!-- Glass Bottle Body -->
    <rect x="-18" y="-15" width="36" height="65" rx="8" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/>
    <!-- Amber Extracted Oil inside -->
    <rect x="-14" y="0" width="28" height="46" rx="4" fill="url(#oilGrad)"/>
    <!-- Dropper Collar & Cap -->
    <rect x="-10" y="-28" width="20" height="13" rx="3" fill="#4C1D95"/>
    <path d="M -5 -28 C -5 -36, 5 -36, 5 -28 Z" fill="#1E1B4B"/>
    <!-- Droplet -->
    <path d="M 0 52 C -4 57, 4 57, 0 52 Z" fill="#F59E0B"/>
    <text x="0" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="7" font-weight="900" text-anchor="middle">OIL EXTRACT</text>
  </g>

  <!-- Handmade BSF Soap Bar (Right) -->
  <g transform="translate(205, 115)">
    <!-- Shadow -->
    <ellipse cx="0" cy="45" rx="45" ry="10" fill="#6D28D9" opacity="0.2"/>
    <!-- 3D Soap Bar -->
    <path d="M -38 0 L -15 -18 L 38 -18 L 15 0 Z" fill="#E0E7FF" stroke="#6D28D9" stroke-width="1.5"/>
    <path d="M 15 0 L 38 -18 L 38 18 L 15 36 Z" fill="#A5B4FC" stroke="#6D28D9" stroke-width="1.5"/>
    <path d="M -38 0 L 15 0 L 15 36 L -38 36 Z" fill="url(#soapGrad)" stroke="#6D28D9" stroke-width="1.5"/>
    <!-- Natural Leaf Emboss on Soap -->
    <g transform="translate(-10, 18)">
      <path d="M -8 8 C -14 -4, 0 -12, 8 -8 C 8 2, 0 8, -8 8 Z" fill="#8B5CF6"/>
      <path d="M -6 6 L 4 -4" stroke="#EDE9FE" stroke-width="1"/>
    </g>
    <!-- Clean soap bubbles -->
    <circle cx="-25" cy="-25" r="7" fill="#FFFFFF" fill-opacity="0.8" stroke="#A78BFA" stroke-width="1"/>
    <circle cx="-15" cy="-35" r="4" fill="#FFFFFF" fill-opacity="0.8" stroke="#A78BFA" stroke-width="1"/>
    <circle cx="25" cy="-20" r="5" fill="#FFFFFF" fill-opacity="0.8" stroke="#A78BFA" stroke-width="1"/>
  </g>

  <!-- Tag Pill -->
  <rect x="60" y="185" width="200" height="22" rx="7" fill="#6D28D9"/>
  <text x="160" y="200" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">
    Minyak Maggot & Sabun Alami
  </text>
</svg>
