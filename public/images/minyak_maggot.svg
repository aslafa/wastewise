<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <radialGradient id="stageBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="60%" stop-color="#F3E8FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </radialGradient>
    <linearGradient id="amberGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="20%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="goldenOil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bottleLabel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#581C87" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="300" rx="18" fill="url(#stageBg)"/>
  <circle cx="200" cy="150" r="110" fill="#FFFFFF" opacity="0.6"/>
  <ellipse cx="200" cy="245" rx="100" ry="14" fill="#DDD6FE" opacity="0.8"/>

  <!-- Golden Droplets Floating around -->
  <g transform="translate(115, 110)">
    <circle cx="0" cy="0" r="10" fill="url(#goldenOil)" filter="url(#dropShadow)"/>
    <circle cx="-3" cy="-3" r="3" fill="#FFFFFF" opacity="0.8"/>
  </g>
  <g transform="translate(285, 95)">
    <circle cx="0" cy="0" r="14" fill="url(#goldenOil)" filter="url(#dropShadow)"/>
    <circle cx="-4" cy="-4" r="4.5" fill="#FFFFFF" opacity="0.8"/>
  </g>
  <g transform="translate(275, 170)">
    <circle cx="0" cy="0" r="8" fill="url(#goldenOil)"/>
    <circle cx="-2" cy="-2" r="2.5" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Main Amber Dropper Bottle -->
  <g transform="translate(150, 45)" filter="url(#dropShadow)">
    <!-- Dropper Bulb (Rubber Top) -->
    <path d="M40 10 C32 10 30 20 30 28 L70 28 C70 20 68 10 60 10 Z" fill="#334155"/>
    <ellipse cx="50" cy="12" rx="14" ry="4" fill="#1E293B"/>

    <!-- Dropper Collar / Cap Ring -->
    <rect x="26" y="28" width="48" height="18" rx="3" fill="url(#capGrad)"/>
    <line x1="26" y1="34" x2="74" y2="34" stroke="#64748B" stroke-width="1"/>
    <line x1="26" y1="40" x2="74" y2="40" stroke="#64748B" stroke-width="1"/>

    <!-- Bottle Neck -->
    <rect x="34" y="46" width="32" height="12" fill="#78350F"/>

    <!-- Bottle Body (Amber Glass) -->
    <rect x="15" y="58" width="70" height="135" rx="14" fill="url(#amberGlass)"/>
    <!-- Glass Highlight Reflection (Left) -->
    <rect x="19" y="62" width="6" height="127" rx="3" fill="#FFFFFF" opacity="0.4"/>
    <!-- Glass Highlight Reflection (Right) -->
    <rect x="76" y="62" width="4" height="127" rx="2" fill="#FEF08A" opacity="0.3"/>

    <!-- Inside Oil Level -->
    <rect x="18" y="85" width="64" height="104" rx="8" fill="url(#goldenOil)" opacity="0.55"/>

    <!-- Front Label Paper -->
    <rect x="22" y="90" width="56" height="85" rx="6" fill="url(#bottleLabel)" stroke="#D97706" stroke-width="1"/>
    <!-- Label Brand Icon: Hexagon + Oil Drop -->
    <polygon points="50,98 58,103 58,113 50,118 42,113 42,103" fill="#D97706"/>
    <circle cx="50" cy="108" r="4" fill="#FFFFFF"/>
    <!-- Label Typography -->
    <text x="50" y="128" fill="#451A03" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" text-anchor="middle" letter-spacing="0.3">MINYAK MAGGOT</text>
    <text x="50" y="137" fill="#78350F" font-family="system-ui, sans-serif" font-size="6" font-weight="bold" text-anchor="middle">EKSTRAKSI BSF</text>
    <line x1="30" y1="142" x2="70" y2="142" stroke="#D97706" stroke-width="0.75"/>
    <text x="50" y="150" fill="#92400E" font-family="system-ui, sans-serif" font-size="5.5" font-weight="semibold" text-anchor="middle">Asam Laurat Alami</text>
    <text x="50" y="160" fill="#047857" font-family="system-ui, sans-serif" font-size="6.5" font-weight="extrabold" text-anchor="middle">100% PURE</text>
    <text x="50" y="169" fill="#78350F" font-family="system-ui, sans-serif" font-size="4.8" text-anchor="middle">30 ml • Grade A</text>
  </g>

  <!-- Official Badge Top Right: ILUSTRASI POTENSI PRODUK -->
  <g transform="translate(18, 18)">
    <rect x="0" y="0" width="168" height="22" rx="11" fill="#7C3AED" fill-opacity="0.95"/>
    <circle cx="12" cy="11" r="4" fill="#A78BFA"/>
    <text x="90" y="15" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="0.4">ILUSTRASI POTENSI PRODUK</text>
  </g>
</svg>

